<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>過橋難題</title>
<style>
:root{--bg:#f1ede4;--card:#fff;--ink:#23222b;--mute:#7b778a;--acc:#e8782f;--line:#e2dccd;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c111f;--card:#151c30;--ink:#eef0f8;--mute:#93a0bd;--acc:#ffb347;--line:#243050}}
:root[data-theme="dark"]{--bg:#0c111f;--card:#151c30;--ink:#eef0f8;--mute:#93a0bd;--acc:#ffb347;--line:#243050}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC",system-ui,sans-serif}
main{max-width:780px;margin:0 auto;padding:14px 14px 28px}
h1{font-size:24px;margin:6px 0 4px;letter-spacing:1px}
.sub{color:var(--mute);font-size:14px;line-height:1.6;margin:0 0 12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:center}
.stat small{display:block;color:var(--mute);font-size:12px}
.stat b{font-size:28px;color:var(--acc);line-height:1.2}
.scene{position:relative;aspect-ratio:800/420;border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.35);background:#0b1226}
.scene svg,.scene canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.scene canvas{pointer-events:none}
#flash{position:absolute;inset:0;background:#cfe0ff;opacity:0;transition:opacity .15s;pointer-events:none}
#flash.on{opacity:.3}
#win{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(6,10,24,.72);color:#ffe3a3;text-align:center;opacity:0;pointer-events:none;transition:opacity .5s;padding:16px}
#win.show{opacity:1;pointer-events:auto}
#win b{font-size:clamp(22px,5vw,38px)}#win span{font-size:clamp(13px,2.6vw,17px);color:#d5dcf2;margin-top:6px}
.char{transition:transform 1.5s cubic-bezier(.45,0,.55,1);cursor:pointer;-webkit-tap-highlight-color:transparent}
.char.off{opacity:.55;cursor:default}
.ring{opacity:0}.char.sel .ring{opacity:1}
.char.sel .inner{animation:hop .8s ease-in-out infinite;filter:drop-shadow(0 0 7px #ffd27a)}
.char.walk .inner{animation:bob .3s ease-in-out infinite alternate}
.legL,.legR{transform-box:fill-box;transform-origin:50% 0}
.char.walk .legL{animation:step .3s ease-in-out infinite alternate}
.char.walk .legR{animation:step .3s ease-in-out infinite alternate-reverse}
@keyframes hop{50%{transform:translateY(-7px)}}
@keyframes bob{to{transform:translateY(-3px)}}
@keyframes step{from{transform:rotate(-28deg)}to{transform:rotate(28deg)}}
@keyframes flow{to{transform:translateX(var(--p))}}
.wv{animation:flow var(--s) linear infinite}
#fl{transition:transform 1.5s cubic-bezier(.45,0,.55,1);pointer-events:none}
.glow{animation:flick 2.2s ease-in-out infinite alternate}
@keyframes flick{from{opacity:.75}to{opacity:1}}
.ctl{display:flex;gap:10px;margin-top:14px}
.go{flex:1;padding:15px;border:0;border-radius:14px;background:linear-gradient(180deg,#ffc15a,#ef8a2a);color:#2a1700;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(239,138,42,.35)}
.go:disabled{opacity:.4;box-shadow:none;cursor:not-allowed}
.rs{padding:15px 20px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font-size:15px;cursor:pointer}
.rules{list-style:none;margin:0 0 12px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;font-size:14px;line-height:1.9}
.rules b{color:var(--acc)}
#win .big{font-size:58px;line-height:1.2}
#win .go{flex:none;margin-top:16px;padding:12px 30px}
#win span{display:block}
#win.bad{background:rgba(34,6,12,.84);color:#ff9d9d}
#msg{margin-top:12px;padding:13px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:15px;line-height:1.6}
#log{margin:10px 0 0;padding-left:22px;color:var(--mute);font-size:13px;line-height:1.8}

.char .inner{transform-box:fill-box;transform-origin:50% 100%}
.char.walk .inner{animation:sway .34s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg) translateY(-4px)}}
#pick h2{font-size:16px;margin:16px 0 8px}
.prow{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.pcard{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:8px 6px 10px;text-align:center;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .15s,border-color .15s}
.pcard:active{transform:scale(.97)}
.pcard.on{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 30%,transparent)}
.pcard img{height:190px;width:auto;max-width:100%;object-fit:contain;display:block;margin:0 auto 4px}
.pcard.on img{animation:hop .9s ease-in-out infinite}
.pcard .nm{font-weight:600;font-size:15px}
.pcard .tm{display:inline-block;margin-top:3px;padding:2px 10px;border-radius:99px;background:var(--acc);color:#2a1700;font-size:13px;font-weight:700}
.pkbar{position:sticky;bottom:10px}
.pcard.off{opacity:.5;cursor:default;padding-bottom:8px}.pcard .ph{height:64px;display:flex;align-items:center;justify-content:center;font-size:34px;color:var(--mute)}
.pcard .no{color:var(--acc);margin-right:5px}.pcard small{display:block;color:var(--mute);font-size:12px}
@media(max-width:480px){.ctl .rs{padding:15px 11px;font-size:14px}}
</style>
</head>
<body>
<main id="pick"><h1>🔦 過橋難題</h1><p class="sub">從下面任選 4 位同學上場。每次開始，過橋時間都會隨機分配給他們，要在 20 分鐘內全部過橋。</p><div id="groups"></div><div class="ctl pkbar"><button class="go" id="start" disabled>開始遊戲</button></div></main>
<main id="game" style="display:none">
<h1>🔦 過橋難題</h1>
<p class="sub">暴雨夜裡，四個人要過吊橋，頭上的數字是各自過橋需要的時間。規則如下：</p>
<ol class="rules"><li>👥 一次最多 <b>2 人</b>過橋（1 人也可以）</li><li>🔦 過橋時<b>一定要帶著手電筒</b></li><li>🔦 手電筒<b>只有 1 支</b>，要有人帶回來</li><li>⏱️ 兩人同行，以<b>較慢的人</b>為準；必須在 <b>20 分鐘內</b>全部過橋</li></ol>
<div class="stats">
<div class="stat"><small>已用時間</small><b id="t">0</b><small>分鐘</small></div>
<div class="stat"><small>時限</small><b>20</b><small>分鐘</small></div>
<div class="stat"><small>最佳紀錄</small><b id="best">—</b><small>分鐘</small></div>
</div>
<div class="scene" id="scene">
<svg viewBox="0 0 800 420" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070b18"/><stop offset="1" stop-color="#1f2f52"/></linearGradient>
<linearGradient id="riv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b4a6e"/><stop offset="1" stop-color="#081a30"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#ffe9a8" stop-opacity=".9"/><stop offset=".35" stop-color="#ffc15a" stop-opacity=".35"/><stop offset="1" stop-color="#ffc15a" stop-opacity="0"/></radialGradient>
<radialGradient id="moon"><stop offset="0" stop-color="#dfe8ff" stop-opacity=".5"/><stop offset="1" stop-color="#dfe8ff" stop-opacity="0"/></radialGradient>
</defs>
<rect width="800" height="420" fill="url(#sky)"/>
<circle cx="650" cy="70" r="70" fill="url(#moon)"/><circle cx="650" cy="70" r="16" fill="#cdd9f5" opacity=".55"/>
<polygon points="0,170 90,110 180,160 300,90 430,150 540,100 680,155 800,110 800,262 0,262" fill="#0f1930"/>
<polygon points="0,205 120,160 260,195 400,150 560,205 700,165 800,195 800,262 0,262" fill="#14213d"/>
<g fill="#1e2b4d" opacity=".75"><ellipse cx="160" cy="55" rx="90" ry="16"/><ellipse cx="420" cy="38" rx="120" ry="14"/><ellipse cx="560" cy="86" rx="80" ry="12"/></g>
<g id="trees" fill="#0a1222"></g>
<rect y="262" width="800" height="158" fill="url(#riv)"/>
<g id="waves"></g>
<g id="bridge">
<path d="M232 195 Q400 255 568 195" stroke="#7a5a3a" stroke-width="3.5" fill="none"/>
<g id="vert" stroke="#5e442c" stroke-width="2"></g>
<rect x="232" y="258" width="336" height="5" fill="#3b2a1a"/>
<g id="planks"></g>
<rect x="226" y="180" width="10" height="86" rx="3" fill="#4a3322"/><rect x="564" y="180" width="10" height="86" rx="3" fill="#4a3322"/>
</g>
<path d="M0 250 L222 250 Q238 252 242 272 L242 420 L0 420Z" fill="#1c2a24"/><rect x="0" y="250" width="228" height="7" fill="#2d4a35"/>
<path d="M800 250 L578 250 Q562 252 558 272 L558 420 L800 420Z" fill="#1c2a24"/><rect x="572" y="250" width="228" height="7" fill="#2d4a35"/>
<g id="chars"></g>
<g id="fl" style="transform:translate(250px,232px)"><circle class="glow" r="120" fill="url(#glow)" style="mix-blend-mode:screen"/><rect x="-5" y="-6" width="10" height="14" rx="3" fill="#ffd27a"/><rect x="-3" y="-10" width="6" height="5" rx="2" fill="#8a6a2a"/></g>
</svg>
<canvas id="rain"></canvas>
<div id="flash"></div>
<div id="win"></div>
</div>
<div class="ctl"><button class="go" id="go" disabled>過橋</button><button class="rs" id="rs">重來</button><button class="rs" id="redeal">換時間</button><button class="rs" id="back">換角色</button></div>
<div id="msg"></div>
<ol id="log"></ol>
</main>
<script>
let P=[];
const lx=i=>38+i*56, rx=i=>588+i*56, Y=250, $=id=>document.getElementById(id);
let side,fl,time,sel,log,best=null,lock=false;
// scenery
$("trees").innerHTML=[14,64,118,176,640,700,752,792].map(x=>`<path d="M${x-16} 252 L${x} 190 L${x+16} 252Z"/><path d="M${x-12} 222 L${x} 168 L${x+12} 222Z"/>`).join("");
$("planks").innerHTML=Array.from({length:24},(_,k)=>`<rect x="${234+k*14}" y="250" width="12.5" height="9" rx="1.5" fill="${k%2?"#6b4a2b":"#7d5833"}"/>`).join("");
$("vert").innerHTML=Array.from({length:17},(_,k)=>{const x=240+k*20,u=(x-232)/336,y=195+60*u*(1-u)*0+ (2*u*(1-u))*60*1;return `<line x1="${x}" y1="${y.toFixed(1)}" x2="${x}" y2="251"/>`}).join("");
function wave(y,a,p,fill,s,stroke){let d=`M0 ${y} q ${p/4} ${-a} ${p/2} 0`;for(let k=0;k<(900/p)*2+3;k++)d+=` t ${p/2} 0`;d+=` L${p*12} 420 L0 420Z`;return `<path class="wv" style="--p:${-p}px;--s:${s}s" d="${d}" fill="${fill}" stroke="${stroke}" stroke-width="1.5"/>`}
$("waves").innerHTML=wave(272,5,90,"rgba(120,190,230,.16)",3.5,"rgba(255,255,255,.28)")+wave(296,7,130,"rgba(70,140,190,.2)",5,"rgba(255,255,255,.2)")+wave(330,9,170,"rgba(20,60,100,.35)",7,"rgba(255,255,255,.12)");
// characters
let els=[];
function buildChars(){const HH=140;
$("chars").innerHTML=P.map((p,i)=>{let hh=HH,w=hh*p.ar;if(w>90){w=90;hh=w/p.ar}return `<g class="char" data-i="${i}" style="transform:translate(${lx(i)}px,${Y}px)"><ellipse class="ring" cx="0" cy="2" rx="${w/2+6}" ry="6" fill="none" stroke="#ffd27a" stroke-width="2.5"/><ellipse cx="0" cy="1" rx="${w/2+2}" ry="4" fill="#000" opacity=".35"/><g class="inner"><image href="${p.img}" x="${-w/2}" y="${-hh}" width="${w}" height="${hh}"/><g transform="translate(0,${-hh-6})"><rect x="-22" y="-12" width="44" height="22" rx="11" fill="rgba(15,22,40,.88)" stroke="#ffd27a" stroke-width="1.5"/><text x="0" y="4" text-anchor="middle" font-size="13" font-weight="700" fill="#ffd27a">${p.t} 分</text></g></g><rect x="${-w/2-6}" y="${-hh-20}" width="${w+12}" height="${hh+22}" fill="transparent"/></g>`}).join("");
els=[...document.querySelectorAll(".char")]}
$("chars").onclick=e=>{const c=e.target.closest(".char");if(!c||lock||done()||time>20)return;const i=+c.dataset.i;if(side[i]!==fl)return;
if(sel.has(i))sel.delete(i);else{if(sel.size>=2)sel.delete([...sel][0]);sel.add(i)}refresh()};
const done=()=>side.every(s=>s===1);
function place(){els.forEach((el,i)=>el.style.transform=`translate(${side[i]?rx(i):lx(i)}px,${Y}px)`);$("fl").style.transform=`translate(${fl?550:250}px,232px)`}
function refresh(){els.forEach((el,i)=>{el.classList.toggle("sel",sel.has(i));el.classList.toggle("off",side[i]!==fl)});
$("t").textContent=time;$("best").textContent=best??"—";$("go").disabled=lock||!sel.size||done()||time>20;
$("log").innerHTML=log.map(l=>`<li>${l}</li>`).join("");
if(!done()&&time<=20)$("msg").textContent=`手電筒在${fl?"右":"左"}岸，剩餘 ${20-time} 分鐘。點選 1～2 人帶著手電筒過橋，再按「過橋」。`}
$("go").onclick=()=>{const ids=[...sel],cost=Math.max(...ids.map(i=>P[i].t));lock=true;
log.push(`${ids.map(i=>P[i].t+" 分").join("＋")} ${fl?"回來":"過河"}（${cost} 分鐘）`);time+=cost;
ids.forEach(i=>{side[i]=1-side[i];els[i].classList.add("walk")});fl=1-fl;sel=new Set();place();refresh();
setTimeout(()=>{els.forEach(e=>e.classList.remove("walk"));lock=false;
if(done()&&time<=20){if(best===null||time<best)best=time;
$("win").className="show";$("win").innerHTML=`<div class="big">🎉</div><b>通關成功！</b><span>用時 ${time} 分鐘（時限 20 分鐘）</span><span>${time<=OPT?`完美！這是最短的 ${OPT} 分鐘。`:`過關了！再挑戰最短的 ${OPT} 分鐘吧。`}</span><button class="go">再玩一次</button>`;
$("msg").textContent="全員平安過橋，通關！"}
else if(time>20){$("win").className="show bad";$("win").innerHTML=`<div class="big">⛈️</div><b>挑戰失敗</b><span>已用 ${time} 分鐘，超過 20 分鐘的時限。</span><span>再想想看，還有更快的安排。</span><button class="go">重新挑戰</button>`;
$("msg").textContent="超過時限，挑戰失敗。"}
refresh()},1550)};
$("rs").onclick=()=>{side=[0,0,0,0];fl=0;time=0;sel=new Set();log=[];lock=false;$("win").className="";place();refresh()};
$("win").onclick=()=>$("rs").click();
// rain + lightning
const cv=$("rain"),cx=cv.getContext("2d"),sc=$("scene");let W,H,D=[];
function rz(){W=cv.width=sc.clientWidth;H=cv.height=sc.clientHeight;D=Array.from({length:150},()=>({x:Math.random()*W,y:Math.random()*H,l:10+Math.random()*14,v:9+Math.random()*8}))}
function tick(){cx.clearRect(0,0,W,H);cx.strokeStyle="rgba(190,215,255,.35)";cx.beginPath();for(const d of D){cx.moveTo(d.x,d.y);cx.lineTo(d.x-d.l*.25,d.y+d.l);d.y+=d.v;d.x-=d.v*.25;if(d.y>H||d.x<0){d.y=-20;d.x=Math.random()*W*1.2}}cx.stroke();requestAnimationFrame(tick)}
function zap(){$("flash").classList.add("on");setTimeout(()=>$("flash").classList.remove("on"),160);setTimeout(zap,7000+Math.random()*9000)}

const ROSTER="格雍,立德,宗碩,博恩,麒安,建綱,翔仁,宥榤,立凱,祐郡,品翔,煜凱,芯妤,昀榛,依庭,儀瑄,佩君,靜澐,景喬,悅兒,詠恩,筱彤,以萌,婉妮,允言".split(",");
const BY=Object.fromEntries(G.flat().concat(EXTRA,EXTRA2,EXTRA3,EXTRA4).map(p=>[p.n,p]));
const POOL=ROSTER.map((n,i)=>({...(BY[n]||{ar:0}),n,seat:i+1}));
let pk=[],OPT=0;
$("groups").innerHTML=`<div class="prow">${POOL.map((p,i)=>p.img?`<div class="pcard" data-i="${i}"><img src="${p.img}" alt="${p.n}"><div class="nm">${p.n}</div></div>`:`<div class="pcard off" data-i="${i}"><div class="ph">?</div><div class="nm">${p.n}</div><small>尚未上傳</small></div>`).join("")}</div>`;
$("pick").querySelector(".sub").textContent+=`（已上傳 ${POOL.filter(p=>p.img).length}/${POOL.length} 位，依座號排列）`;
function pkRefresh(){document.querySelectorAll(".pcard").forEach(c=>c.classList.toggle("on",pk.includes(+c.dataset.i)));const n=pk.length;$("start").disabled=n!==4;$("start").textContent=n===4?"開始遊戲":`開始遊戲（已選 ${n}/4）`}
$("groups").onclick=e=>{const c=e.target.closest(".pcard");if(!c)return;const i=+c.dataset.i;if(!POOL[i].img)return;if(pk.includes(i))pk=pk.filter(v=>v!==i);else if(pk.length<4)pk.push(i);pkRefresh()};
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function deal(){const ts=shuffle([1,rnd([2,3]),rnd([4,5,6,7,8]),rnd([9,10])]);P=pk.map((i,k)=>({...POOL[i],t:ts[k]}));const t=ts.slice().sort((x,y)=>x-y);OPT=Math.min(t[0]+3*t[1]+t[3],2*t[0]+t[1]+t[2]+t[3])}
function begin(){best=null;buildChars();$("rs").click()}
$("start").onclick=()=>{deal();$("pick").style.display="none";$("game").style.display="";rz();begin();scrollTo(0,0)};
$("redeal").onclick=()=>{deal();begin()};
$("back").onclick=()=>{$("game").style.display="none";$("pick").style.display="";scrollTo(0,0)};
pkRefresh();
</script>
